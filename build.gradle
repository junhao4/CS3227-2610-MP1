plugins {
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.4.3'
}

group = 'cs3227.mp1'
version = '0.1.0'

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

def javaFxVersion = '17.0.7'
def targetPlatforms = ['win', 'linux', 'mac-aarch64']

dependencies {
    targetPlatforms.each { platform ->
        implementation("org.openjfx:javafx-base:${javaFxVersion}:${platform}")
        implementation("org.openjfx:javafx-controls:${javaFxVersion}:${platform}")
        implementation("org.openjfx:javafx-fxml:${javaFxVersion}:${platform}")
        implementation("org.openjfx:javafx-graphics:${javaFxVersion}:${platform}")
    }

    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

application {
    mainClass = 'cs3227.moneymap.Launcher'
}

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    prototype
}

tasks.named('checkstyleSmoke', Checkstyle) {
    source sourceSets.smoke.allJava
    classpath = sourceSets.smoke.compileClasspath
}

tasks.named('checkstylePrototype', Checkstyle) {
    source sourceSets.prototype.allJava
    classpath = sourceSets.prototype.compileClasspath
}

configurations {
    smokeImplementation.extendsFrom implementation
    prototypeImplementation.extendsFrom implementation
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-native-access=javafx.graphics'
}

tasks.register('verifyPrototypes', JavaExec) {
    group = 'verification'
    description = 'Loads every exploratory prototype FXML resource.'
    classpath = sourceSets.prototype.runtimeClasspath
    mainClass = 'cs3227.prototype.PrototypeSmokeTest'
}

tasks.register('runPrototype', JavaExec) {
    group = 'application'
    description = 'Runs the interactive static UI prototype application.'
    classpath = sourceSets.prototype.runtimeClasspath
    mainClass = 'cs3227.prototype.PrototypeApp'
}

tasks.register('verifyApplication', JavaExec) {
    group = 'verification'
    description = 'Verifies production startup and every navigation destination.'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'cs3227.moneymap.ApplicationSmokeTest'
}

tasks.register('verifyDashboardUi', JavaExec) {
    group = 'verification'
    description = 'Verifies Dashboard summaries, budget states, month refresh, and layout safeguards.'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'cs3227.moneymap.DashboardUiSmokeTest'
}

tasks.register('verifyTransactionUi', JavaExec) {
    group = 'verification'
    description = 'Verifies transaction creation, validation, fallback assignment, and reload in JavaFX.'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'cs3227.moneymap.TransactionUiSmokeTest'
}

tasks.register('verifyCategoryUi', JavaExec) {
    group = 'verification'
    description = 'Verifies custom category creation, validation, type scoping, and reload in JavaFX.'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'cs3227.moneymap.CategoryUiSmokeTest'
}

tasks.register('verifyDataAndSettingsUi', JavaExec) {
    group = 'verification'
    description = 'Verifies Data and Settings backup export and user feedback in JavaFX.'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'cs3227.moneymap.DataAndSettingsUiSmokeTest'
}

tasks.named('check') {
    dependsOn tasks.named('checkstyleMain')
    dependsOn tasks.named('checkstyleTest')
    dependsOn tasks.named('checkstyleSmoke')
    dependsOn tasks.named('checkstylePrototype')
    dependsOn tasks.named('verifyApplication')
    dependsOn tasks.named('verifyDashboardUi')
    dependsOn tasks.named('verifyTransactionUi')
    dependsOn tasks.named('verifyCategoryUi')
    dependsOn tasks.named('verifyDataAndSettingsUi')
}

tasks.named('shadowJar') {
    archiveFileName = 'MoneyMap.jar'
    mergeServiceFiles()
    manifest {
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

tasks.named('jar') {
    enabled = false
}

['startScripts', 'distTar', 'distZip'].each { taskName ->
    tasks.named(taskName) {
        enabled = false
    }
}
